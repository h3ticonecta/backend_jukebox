<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="record" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#202020"/>
      <stop offset="0.55" stop-color="#080808"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="label" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#2196ff"/>
      <stop offset="1" stop-color="#0068d7"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".18"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="246" fill="url(#record)"/>

  <!-- vinyl grooves -->
  <g fill="none" stroke="#2d2d2d" stroke-width="2">
    <circle cx="256" cy="256" r="226"/>
    <circle cx="256" cy="256" r="207"/>
    <circle cx="256" cy="256" r="188"/>
    <circle cx="256" cy="256" r="169"/>
    <circle cx="256" cy="256" r="150"/>
    <circle cx="256" cy="256" r="131"/>
    <circle cx="256" cy="256" r="112"/>
  </g>

  <!-- subtle glossy reflections -->
  <path d="M86 170 A246 246 0 0 1 337 25 A246 246 0 0 0 71 118 Z"
        fill="url(#shine)" opacity=".65"/>
  <path d="M435 342 A246 246 0 0 1 282 493 A246 246 0 0 0 457 385 Z"
        fill="url(#shine)" opacity=".55"/>

  <!-- blue center label -->
  <circle cx="256" cy="256" r="72" fill="url(#label)"/>
  <circle cx="256" cy="256" r="65" fill="none" stroke="#005bbd" stroke-width="3"/>

  <!-- spindle hole -->
  <circle cx="256" cy="256" r="15" fill="#050505"/>
  <circle cx="256" cy="256" r="8" fill="#fff"/>
</svg>
