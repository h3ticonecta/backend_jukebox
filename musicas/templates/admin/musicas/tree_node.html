<li>
  <a href="?prefix={{ node.path|urlencode }}" {% if browse.current_path == node.path %}class="active"{% endif %}>
    📁 {{ node.name }}
  </a>
  {% if node.children %}
    <ul>
      {% for child in node.children %}
        {% include "admin/musicas/tree_node.html" with node=child %}
      {% endfor %}
    </ul>
  {% endif %}
</li>
